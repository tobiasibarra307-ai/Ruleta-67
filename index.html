<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ruleta de Colores</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      color: white;
      font-family: sans-serif;
      margin: 0;
    }

    .contenedor-ruleta {
      position: relative;
      margin-bottom: 20px;
    }

    /* Flecha/Indicador superior */
    .indicador {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ffcc00;
      z-index: 10;
    }

    canvas {
      border: 4px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      background-color: #ffcc00;
      color: #1a1a1a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #e6b800;
    }
  </style>
</head>
<body>

  <div class="contenedor-ruleta">
    <div class="indicador"></div>
    <canvas id="ruletaCanvas" width="400" height="400"></canvas>
  </div>

  <button id="btnGirar">Girar Ruleta</button>

  <script>
    const canvas = document.getElementById('ruletaCanvas');
    const ctx = canvas.getContext('2d');
    const btnGirar = document.getElementById('btnGirar');

    // Números de la ruleta en orden estándar (0 en verde, el resto alternados entre rojo y negro)
    const numeros = [
      { num: '0', color: '#2b8a3e' },  // Verde
      { num: '32', color: '#d9383a' }, // Rojo
      { num: '15', color: '#1a1a1a' }, // Negro
      { num: '19', color: '#d9383a' },
      { num: '4', color: '#1a1a1a' },
      { num: '21', color: '#d9383a' },
      { num: '2', color: '#1a1a1a' },
      { num: '25', color: '#d9383a' },
      { num: '17', color: '#1a1a1a' },
      { num: '34', color: '#d9383a' },
      { num: '6', color: '#1a1a1a' },
      { num: '27', color: '#d9383a' },
      { num: '13', color: '#1a1a1a' },
      { num: '36', color: '#d9383a' },
      { num: '11', color: '#1a1a1a' },
      { num: '30', color: '#d9383a' },
      { num: '8', color: '#1a1a1a' },
      { num: '23', color: '#d9383a' },
      { num: '10', color: '#1a1a1a' },
      { num: '5', color: '#d9383a' },
      { num: '24', color: '#1a1a1a' },
      { num: '16', color: '#d9383a' },
      { num: '33', color: '#1a1a1a' },
      { num: '1', color: '#d9383a' },
      { num: '20', color: '#1a1a1a' },
      { num: '14', color: '#d9383a' },
      { num: '31', color: '#1a1a1a' },
      { num: '9', color: '#d9383a' },
      { num: '22', color: '#1a1a1a' },
      { num: '18', color: '#d9383a' },
      { num: '29', color: '#1a1a1a' },
      { num: '7', color: '#d9383a' },
      { num: '28', color: '#1a1a1a' },
      { num: '12', color: '#d9383a' },
      { num: '35', color: '#1a1a1a' },
      { num: '3', color: '#d9383a' },
      { num: '26', color: '#1a1a1a' }
    ];

    const totalSectores = numeros.length;
    const anguloPorSector = (2 * Math.PI) / totalSectores;
    const centroX = canvas.width / 2;
    const centroY = canvas.height / 2;
    const radio = centroX - 5;

    let anguloActual = 0;
    let girando = false;

    // Dibujar la ruleta con divisiones de color y números centrados
    function dibujarRuleta() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < totalSectores; i++) {
        const anguloInicio = anguloActual + i * anguloPorSector;
        const anguloFin = anguloInicio + anguloPorSector;

        // 1. Dibujar el sector (división de color)
        ctx.beginPath();
        ctx.moveTo(centroX, centroY);
        ctx.arc(centroX, centroY, radio, anguloInicio, anguloFin);
        ctx.closePath();
        ctx.fillStyle = numeros[i].color;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 2. Dibujar y centrar el número en su sector
        ctx.save();
        ctx.translate(centroX, centroY);
        ctx.rotate(anguloInicio + anguloPorSector / 2);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';

        // Posicionamiento en el radio para dejarlo centrado visualmente
        ctx.fillText(numeros[i].num, radio * 0.75, 0);
        ctx.restore();
      }
    }

    // Animación del giro
    function girar() {
      if (girando) return;
      girando = true;

      const girosCompletos = Math.floor(Math.random() * 5) + 5;
      const anguloExtra = Math.random() * Math.PI * 2;
      const anguloTotal = girosCompletos * Math.PI * 2 + anguloExtra;

      let tiempoInicio = null;
      const duracion = 4000;

      function animacion(timestamp) {
        if (!tiempoInicio) tiempoInicio = timestamp;
        const tiempoTranscurrido = timestamp - tiempoInicio;
        const progreso = Math.min(tiempoTranscurrido / duracion, 1);

        const avance = 1 - Math.pow(1 - progreso, 3);
        anguloActual = (anguloTotal * avance) % (Math.PI * 2);

        dibujarRuleta();

        if (progreso < 1) {
          requestAnimationFrame(animacion);
        } else {
          girando = false;
        }
      }

      requestAnimationFrame(animacion);
    }

    btnGirar.addEventListener('click', girar);

    // Dibujado inicial
    dibujarRuleta();
  </script>
</body>
</html>
