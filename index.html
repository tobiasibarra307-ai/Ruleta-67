<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de Casino - Night Luxury Edition</title>
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-metallic-border: 3px solid;
            --gold-color: #dfb76c;
            --dark-bg: #090b10;
            --casino-green: radial-gradient(circle at center, #0a3d20 0%, #041a0d 80%, #020f07 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(30, 20, 10, 0.6) 0%, rgba(5, 5, 8, 0.95) 70%),
                radial-gradient(circle at 20% 80%, rgba(186, 139, 41, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(186, 139, 41, 0.08) 0%, transparent 50%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Wrapper con marco dorado metálico redondeado */
        .casino-table-frame {
            position: relative;
            background: #0d121c;
            border-radius: 28px;
            padding: 25px;
            background-clip: padding-box;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.8),
                inset 0 0 100px rgba(0,0,0,0.9);
        }

        .casino-table-frame::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            border-radius: 32px;
            z-index: -1;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 10px rgba(0,0,0,0.5);
        }

        .casino-container {
            background: var(--casino-green);
            border-radius: 20px;
            padding: 25px;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.85);
            max-width: 1280px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Encabezado HUD */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #181d26 0%, #0c0f14 100%);
            padding: 15px 30px;
            border-radius: 16px;
            border: 2px solid;
            border-image: var(--gold-gradient) 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .hud-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #dfb76c;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .hud-value {
            font-size: 24px;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
        }

        /* Área central del juego */
        .game-main-area {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: flex-start;
        }

        /* Contenedor de la Ruleta */
        .wheel-outer-ring {
            position: relative;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            padding: 12px;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 20%, #b38728 40%, #fbf5b7 60%, #aa771c 80%, #5c3e09 100%);
            box-shadow: 
                0 0 35px rgba(212, 175, 55, 0.5),
                0 15px 35px rgba(0,0,0,0.9),
                inset 0 2px 5px rgba(255,255,255,0.8),
                inset 0 -5px 10px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .wheel-inner-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #2c1a0e 0%, #0f0804 100%);
            border: 4px solid #1a0f07;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        .roulette-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        /* Puntero Superior */
        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 32px;
            background: var(--gold-gradient);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
        }

        /* Eje Central */
        .wheel-center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 30%, #b38728 60%, #fbf5b7 80%, #aa771c 100%);
            border: 3px solid #5c3e09;
            box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.6);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-center-cap::after {
            content: '';
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            border: 2px solid #dfb76c;
        }

        /* Segmentos de la ruleta simétricos */
        .number-segment {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* 360 / 38 = 9.4736deg total -> +/- 4.7368deg desde el eje vertical (50% 0%) */
            clip-path: polygon(50% 50%, 45.86% 0%, 54.14% 0%);
        }

        /* Texto perfectamente alineado dentro del segmento */
        .number-text {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 800;
            font-size: 10px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            z-index: 5;
            line-height: 1;
            text-align: center;
            width: 100%;
        }

        /* Historial */
        .stats-panel {
            background: linear-gradient(180deg, #141821 0%, #090c10 100%);
            border-radius: 16px;
            padding: 15px;
            width: 120px;
            border: 2px solid;
            border-image: var(--gold-gradient) 1;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .stats-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #dfb76c;
            font-weight: bold;
            text-align: center;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .history-item {
            width: 100%;
            padding: 6px 0;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Tablero de Apuestas */
        .betting-board-container {
            flex: 1;
            min-width: 580px;
            background: rgba(0, 20, 10, 0.85);
            border-radius: 16px;
            padding: 20px;
            border: 2px solid;
            border-image: var(--gold-gradient) 1;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 25px rgba(0,0,0,0.5);
        }

        .betting-grid {
            display: grid;
            grid-template-columns: 50px repeat(12, 1fr);
            grid-template-rows: repeat(3, 48px) 45px 45px;
            gap: 4px;
        }

        .cell {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(223, 183, 108, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .cell:hover {
            border-color: #fcf6ba;
            box-shadow: 0 0 12px rgba(252, 246, 186, 0.5);
            transform: translateY(-2px);
            z-index: 5;
        }

        .cell-red { background: linear-gradient(135deg, #a81c1c 0%, #6e0d0d 100%); color: #fff; }
        .cell-black { background: linear-gradient(135deg, #2b2b2b 0%, #111111 100%); color: #fff; }
        .cell-green { background: linear-gradient(135deg, #0e7a36 0%, #05401b 100%); color: #fff; }

        .cell-zero { grid-column: 1; grid-row: 1 / span 2; }
        .cell-double-zero { grid-column: 1; grid-row: 3; }

        .cell-doz {
            grid-row: 4;
            background: linear-gradient(180deg, rgba(30, 40, 55, 0.8) 0%, rgba(15, 20, 30, 0.8) 100%);
            color: #dfb76c;
            border: 1px solid rgba(223, 183, 108, 0.4);
        }

        .cell-outside {
            grid-row: 5;
            background: linear-gradient(180deg, rgba(25, 35, 45, 0.8) 0%, rgba(10, 15, 22, 0.8) 100%);
            color: #e0e0e0;
            border: 1px solid rgba(223, 183, 108, 0.4);
            font-size: 12px;
        }

        /* Ficha Depositada */
        .bet-chip-placed {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--gold-gradient);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.8);
            z-index: 10;
            pointer-events: none;
        }

        /* Selector de Fichas */
        .chip-selector-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .chip-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 3px dashed #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            color: #fff;
            text-shadow: 1px 1px 3px #000, -1px -1px 3px #000;
            position: relative;
        }

        .chip-btn.selected {
            transform: scale(1.18) translateY(-5px);
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(252, 246, 186, 0.8), 0 8px 16px rgba(0,0,0,0.8);
        }

        .chip-10 { background: linear-gradient(135deg, #1e88e5 0%, #0d47a1 100%); }
        .chip-50 { background: linear-gradient(135deg, #43a047 0%, #1b5e20 100%); }
        .chip-100 { background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%); }
        .chip-1000 { 
            background-image: url('tung-tung.jpg'); 
            background-size: cover; 
            background-position: center;
            border: 3px dashed #ffcc00;
        }

        /* Acciones */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .btn-action {
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
        }

        .btn-clear {
            background: linear-gradient(135deg, #424242 0%, #212121 100%);
            color: #dfb76c;
            border: 2px solid #dfb76c;
        }

        .btn-spin {
            background: var(--gold-gradient);
            color: #1a0f07;
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.8);
        }

        /* Overlay y Popup de Victoria */
        .win-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .win-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .win-modal {
            background: linear-gradient(180deg, #1a2230 0%, #0a0e17 100%);
            border: 4px solid;
            border-image: var(--gold-gradient) 1;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.6);
            transform: scale(0.8);
            transition: transform 0.4s ease;
        }

        .win-overlay.active .win-modal {
            transform: scale(1);
        }

        .win-title {
            font-size: 28px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .win-image {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #dfb76c;
            margin-bottom: 20px;
        }

        .btn-close-pop {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="casino-table-frame">
        <div class="casino-container">
            
            <!-- Encabezado HUD -->
            <div class="hud-header">
                <div class="hud-card">
                    <span class="hud-title">Saldo</span>
                    <span class="hud-value" id="balance-val">$1,000</span>
                </div>
                <div class="hud-card">
                    <span class="hud-title">Apuesta Total</span>
                    <span class="hud-value" id="total-bet-val">$0</span>
                </div>
                <div class="hud-card">
                    <span class="hud-title">Último Premio</span>
                    <span class="hud-value" id="last-win-val">$0</span>
                </div>
            </div>

            <!-- Área Principal -->
            <div class="game-main-area">
                
                <!-- Ruleta con Borde Dorado Metálico -->
                <div class="wheel-outer-ring">
                    <div class="wheel-pointer"></div>
                    <div class="wheel-inner-ring">
                        <div class="roulette-wheel" id="wheel">
                            <!-- Números generados dinámicamente -->
                        </div>
                        <div class="wheel-center-cap"></div>
                    </div>
                </div>

                <!-- Historial -->
                <div class="stats-panel">
                    <div class="stats-title">Historial</div>
                    <div class="history-list" id="history-list"></div>
                </div>

                <!-- Tablero de Apuestas -->
                <div class="betting-board-container">
                    <div class="betting-grid" id="betting-grid"></div>

                    <!-- Selector de Fichas -->
                    <div class="chip-selector-container">
                        <div class="chip-btn chip-10 selected" onclick="selectChip(10, this)">$10</div>
                        <div class="chip-btn chip-50" onclick="selectChip(50, this)">$50</div>
                        <div class="chip-btn chip-100" onclick="selectChip(100, this)">$100</div>
                        <div class="chip-btn chip-1000" onclick="selectChip(1000, this)">1K</div>
                    </div>

                    <!-- Acciones -->
                    <div class="action-bar">
                        <button class="btn-action btn-clear" onclick="clearBets()">Limpiar</button>
                        <button class="btn-action btn-spin" id="spin-btn" onclick="spinWheel()">¡Girar!</button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Popup Emergente de Victoria -->
    <div class="win-overlay" id="win-popup">
        <div class="win-modal">
            <div class="win-title" id="win-popup-title">¡GANASTE!</div>
            <img src="1000203948.jpg" alt="Victoria" class="win-image">
            <div>
                <button class="btn-close-pop" onclick="closePopup()">Continuar jugando</button>
            </div>
        </div>
    </div>

    <script>
        const wheelOrder = [
            "0", "28", "9", "26", "30", "11", "7", "20", "32", "17", "5", "22", "34", "15", "3", "24", "36", "13", "1",
            "00", "27", "10", "25", "29", "12", "8", "19", "31", "18", "6", "21", "33", "16", "4", "23", "35", "14", "2"
        ];

        const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

        let balance = 1000;
        let selectedChipValue = 10;
        let currentBets = {};
        let isSpinning = false;
        let history = [];

        function initWheel() {
            const wheelEl = document.getElementById('wheel');
            const totalSegments = wheelOrder.length;
            const angleStep = 360 / totalSegments;

            wheelOrder.forEach((num, index) => {
                const seg = document.createElement('div');
                seg.className = 'number-segment';
                const angle = index * angleStep;

                // Color de fondo para cada casillero
                let bgColor = '#111111'; // Negro
                if (num === '0' || num === '00') {
                    bgColor = '#0e7a36'; // Verde
                } else if (redNumbers.includes(parseInt(num))) {
                    bgColor = '#a81c1c'; // Rojo
                }

                seg.style.backgroundColor = bgColor;
                seg.style.transform = `rotate(${angle}deg)`;

                // Mantener el texto orientado hacia el centro y centrado en la cuña de color
                seg.innerHTML = `<span class="number-text">${num}</span>`;
                wheelEl.appendChild(seg);
            });
        }

        function initBoard() {
            const grid = document.getElementById('betting-grid');
            grid.innerHTML = '';

            const c0 = createCell('0', 'cell-green cell-zero', '0');
            const c00 = createCell('00', 'cell-green cell-double-zero', '00');
            grid.appendChild(c0);
            grid.appendChild(c00);

            for (let row = 3; row >= 1; row--) {
                for (let col = 0; col < 12; col++) {
                    const num = col * 3 + row;
                    const isRed = redNumbers.includes(num);
                    const cellClass = isRed ? 'cell-red' : 'cell-black';
                    const cell = createCell(num.toString(), cellClass, num.toString());
                    cell.style.gridColumn = col + 2;
                    cell.style.gridRow = 4 - row;
                    grid.appendChild(cell);
                }
            }

            const doz1 = createCell('1st 12', 'cell-doz', '1st12'); doz1.style.gridColumn = '2 / span 4';
            const doz2 = createCell('2nd 12', 'cell-doz', '2nd12'); doz2.style.gridColumn = '6 / span 4';
            const doz3 = createCell('3rd 12', 'cell-doz', '3rd12'); doz3.style.gridColumn = '10 / span 4';
            grid.appendChild(doz1); grid.appendChild(doz2); grid.appendChild(doz3);

            const out1 = createCell('1-18', 'cell-outside', '1-18'); out1.style.gridColumn = '2 / span 2';
            const out2 = createCell('EVEN', 'cell-outside', 'PAR'); out2.style.gridColumn = '4 / span 2';
            const out3 = createCell('RED', 'cell-outside cell-red', 'ROJO'); out3.style.gridColumn = '6 / span 2';
            const out4 = createCell('BLACK', 'cell-outside cell-black', 'NEGRO'); out4.style.gridColumn = '8 / span 2';
            const out5 = createCell('ODD', 'cell-outside', 'IMPAR'); out5.style.gridColumn = '10 / span 2';
            const out6 = createCell('19-36', 'cell-outside', '19-36'); out6.style.gridColumn = '12 / span 2';

            grid.appendChild(out1); grid.appendChild(out2); grid.appendChild(out3);
            grid.appendChild(out4); grid.appendChild(out5); grid.appendChild(out6);
        }

        function createCell(label, className, betType) {
            const div = document.createElement('div');
            div.className = `cell ${className}`;
            div.innerText = label;
            div.onclick = () => placeBet(betType, div);
            return div;
        }

        function selectChip(val, el) {
            selectedChipValue = val;
            document.querySelectorAll('.chip-btn').forEach(btn => btn.classList.remove('selected'));
            el.classList.add('selected');
        }

        function placeBet(betType, cellEl) {
            if (isSpinning) return;
            if (balance < selectedChipValue) {
                alert('¡Saldo insuficiente!');
                return;
            }

            balance -= selectedChipValue;
            currentBets[betType] = (currentBets[betType] || 0) + selectedChipValue;

            updateHUD();
            renderBetChips(cellEl, betType);
        }

        function renderBetChips(cellEl, betType) {
            let chip = cellEl.querySelector('.bet-chip-placed');
            if (!chip) {
                chip = document.createElement('div');
                chip.className = 'bet-chip-placed';
                cellEl.appendChild(chip);
            }
            const total = currentBets[betType];
            chip.innerText = total >= 1000 ? (total/1000)+'K' : total;
        }

        function clearBets() {
            if (isSpinning) return;
            let totalRefund = 0;
            for (let key in currentBets) {
                totalRefund += currentBets[key];
            }
            balance += totalRefund;
            currentBets = {};
            document.querySelectorAll('.bet-chip-placed').forEach(el => el.remove());
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('balance-val').innerText = `$${balance.toLocaleString()}`;
            let totalBet = Object.values(currentBets).reduce((a, b) => a + b, 0);
            document.getElementById('total-bet-val').innerText = `$${totalBet.toLocaleString()}`;
        }

        function spinWheel() {
            if (isSpinning) return;
            let totalBet = Object.values(currentBets).reduce((a, b) => a + b, 0);
            if (totalBet === 0) {
                alert('Colocá al menos una apuesta en la mesa');
                return;
            }

            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;

            const randomIndex = Math.floor(Math.random() * wheelOrder.length);
            const winningNumber = wheelOrder[randomIndex];
            const degreesPerSegment = 360 / wheelOrder.length;

            const extraTurns = 5;
            const targetDegree = (extraTurns * 360) + (360 - (randomIndex * degreesPerSegment));

            const wheelEl = document.getElementById('wheel');
            wheelEl.style.transform = `rotate(${targetDegree}deg)`;

            setTimeout(() => {
                evaluateResult(winningNumber);
                wheelEl.style.transition = 'none';
                wheelEl.style.transform = `rotate(${360 - (randomIndex * degreesPerSegment)}deg)`;
                setTimeout(() => {
                    wheelEl.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
                }, 50);

                isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
            }, 4000);
        }

        function evaluateResult(winNum) {
            let totalWin = 0;
            const numInt = parseInt(winNum);
            const isRed = redNumbers.includes(numInt);
            const isEven = numInt !== 0 && !isNaN(numInt) && numInt % 2 === 0;

            for (let bet in currentBets) {
                let amount = currentBets[bet];

                if (bet === winNum) totalWin += amount * 36;
                else if (bet === '1st12' && numInt >= 1 && numInt <= 12) totalWin += amount * 3;
                else if (bet === '2nd12' && numInt >= 13 && numInt <= 24) totalWin += amount * 3;
                else if (bet === '3rd12' && numInt >= 25 && numInt <= 36) totalWin += amount * 3;
                else if (bet === '1-18' && numInt >= 1 && numInt <= 18) totalWin += amount * 2;
                else if (bet === '19-36' && numInt >= 19 && numInt <= 36) totalWin += amount * 2;
                else if (bet === 'ROJO' && isRed) totalWin += amount * 2;
                else if (bet === 'NEGRO' && !isRed && winNum !== '0' && winNum !== '00') totalWin += amount * 2;
                else if (bet === 'PAR' && isEven) totalWin += amount * 2;
                else if (bet === 'IMPAR' && !isEven && winNum !== '0' && winNum !== '00') totalWin += amount * 2;
            }

            balance += totalWin;
            document.getElementById('last-win-val').innerText = `$${totalWin.toLocaleString()}`;
            currentBets = {};
            document.querySelectorAll('.bet-chip-placed').forEach(el => el.remove());
            updateHUD();
            addHistory(winNum);

            if (totalWin > 0) {
                showWinPopup(totalWin);
            }
        }

        function addHistory(num) {
            history.unshift(num);
            if (history.length > 5) history.pop();

            const container = document.getElementById('history-list');
            container.innerHTML = '';
            history.forEach(n => {
                const item = document.createElement('div');
                item.className = 'history-item';
                if (n === '0' || n === '00') {
                    item.style.backgroundColor = '#0e7a36';
                } else if (redNumbers.includes(parseInt(n))) {
                    item.style.backgroundColor = '#a81c1c';
                } else {
                    item.style.backgroundColor = '#2b2b2b';
                }
                item.innerText = n;
                container.appendChild(item);
            });
        }

        function showWinPopup(amount) {
            document.getElementById('win-popup-title').innerText = `¡GANASTE $${amount.toLocaleString()}!`;
            document.getElementById('win-popup').classList.add('active');
        }

        function closePopup() {
            document.getElementById('win-popup').classList.remove('active');
        }

        initWheel();
        initBoard();
        updateHUD();
    </script>
</body>
</html>
